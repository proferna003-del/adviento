<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2a1f">
<title>Adviento de mi ratón</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Great+Vibes&family=Inter:wght@500;600;700&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --abeto:#0f2a1f; --abeto2:#16382a;
  --oro:#d4ad5e; --oro-claro:#f1d79a; --oro-osc:#a37b33;
  --rojo:#c8202c; --rojo-osc:#8f141d;
  --crema:#f5eee2; --crema2:#e9dfcd;
  --burdeos:#5a1420; --noche:#1a0609;
  --tinta:#2a1014;
  --sans:"Archivo Black","Inter",system-ui,sans-serif;
  --ui:"Inter",system-ui,sans-serif;
  --serif:"Cormorant Garamond",Georgia,serif;
  --firma:"Playfair Display",Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--abeto);color:var(--crema);font-family:var(--serif);overflow-x:hidden}
[hidden]{display:none!important}
body.en-calendario{background:var(--noche)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

.pantalla{position:fixed;inset:0;transition:opacity 1.1s ease}
.oculta{opacity:0;pointer-events:none}

/* ============ PANTALLA 1 · LA PUERTA ============ */
#puerta-pantalla{
  background:
    radial-gradient(circle at 50% 55%, rgba(255,214,140,.07), transparent 60%),
    radial-gradient(rgba(212,173,94,.28) 1px, transparent 1.3px) 0 0/22px 22px,
    var(--abeto);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:max(24px,env(safe-area-inset-top)) 16px 32px;text-align:center;overflow:hidden;z-index:2;
}
.antetitulo{font-family:var(--ui);font-weight:600;font-size:11px;letter-spacing:.38em;color:var(--oro);text-transform:uppercase}
.titulo-puerta{font-family:var(--sans);font-size:clamp(30px,8vw,46px);line-height:1.02;margin:12px 0 34px;color:var(--crema);letter-spacing:-.01em}

.escena{--w:min(62vw,250px);width:var(--w);height:calc(var(--w)*1.55);position:relative;cursor:pointer;outline:none}
.marco{
  position:absolute;inset:calc(var(--w)*-0.06);
  border-radius:999px 999px 6px 6px;
  background:linear-gradient(160deg,var(--crema),var(--crema2));
  box-shadow:0 30px 60px -20px rgba(0,0,0,.6),inset 0 -6px 0 rgba(0,0,0,.06);
}
.hueco{position:absolute;inset:0;border-radius:calc(var(--w)/2) calc(var(--w)/2) 0 0;overflow:hidden;
  background:radial-gradient(ellipse at 50% 60%,#fff6d8 0%,#ffd77a 30%,#e6a83d 65%,#8a5a14 100%)}
.luz{position:absolute;left:50%;top:55%;width:40px;height:40px;border-radius:50%;transform:translate(-50%,-50%) scale(0);
  background:radial-gradient(circle,rgba(255,240,200,1) 0%,rgba(255,214,130,.85) 30%,rgba(240,180,80,0) 70%);
  pointer-events:none;z-index:5;transition:transform 1.6s cubic-bezier(.6,0,.3,1),opacity 1s}
.hojas{position:absolute;inset:0;perspective:900px}
.hoja{position:absolute;top:0;bottom:0;width:50%;
  background:
    linear-gradient(90deg,rgba(0,0,0,.12),transparent 30%,transparent 70%,rgba(0,0,0,.12)),
    linear-gradient(180deg,#d42733,#a91822);
  transition:transform 1.8s cubic-bezier(.55,.05,.25,1);will-change:transform;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.hoja::before{content:"";position:absolute;left:14%;right:14%;bottom:7%;height:30%;border-radius:4px;
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.14),inset 0 2px 0 rgba(255,255,255,.08)}
.hoja.izq{left:0;transform-origin:left center;border-top-left-radius:100% calc(var(--w)/2);border-right:1px solid rgba(0,0,0,.25)}
.hoja.der{right:0;transform-origin:right center;border-top-right-radius:100% calc(var(--w)/2)}
.hoja.izq::after,.hoja.der::after{content:"";position:absolute;top:56%;width:7px;height:7px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,var(--oro-claro),var(--oro-osc))}
.hoja.izq::after{right:9px}.hoja.der::after{left:9px}
.abierta .hoja.izq{transform:rotateY(78deg)}
.abierta .hoja.der{transform:rotateY(-78deg)}

.corona{position:absolute;left:50%;top:15%;width:38%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;z-index:3;
  background:
    radial-gradient(circle,transparent 46%,transparent 47%),
    repeating-conic-gradient(from 0deg,#1f5a36 0 7deg,#2f7a4a 7deg 13deg,#174a2c 13deg 20deg);
  -webkit-mask:radial-gradient(circle,transparent 48%,#000 49.5%,#000 69%,transparent 70.5%);
          mask:radial-gradient(circle,transparent 48%,#000 49.5%,#000 69%,transparent 70.5%);
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.35));transition:opacity .5s}
.bayas{position:absolute;left:50%;top:15%;width:38%;aspect-ratio:1;transform:translateX(-50%);z-index:4;pointer-events:none;transition:opacity .5s}
.bayas i{position:absolute;width:6%;height:6%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3e2b0,var(--oro-osc))}
.placa{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;
  background:linear-gradient(160deg,var(--crema),var(--crema2));color:var(--tinta);
  font-family:"Great Vibes",cursive;font-size:calc(var(--w)*.13);line-height:1;
  padding:.3em .7em .35em;border-radius:3px;white-space:nowrap;
  box-shadow:0 4px 10px rgba(0,0,0,.3),inset 0 0 0 1px rgba(163,123,51,.5),inset 0 0 0 4px var(--crema),inset 0 0 0 5px rgba(163,123,51,.35);
  transition:opacity .5s}
.abierta .corona,.abierta .bayas,.abierta .placa{opacity:0}
.llama{margin-top:38px;font-family:var(--ui);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:rgba(241,215,154,.75);
  animation:latido 2.6s ease-in-out infinite}
@keyframes latido{50%{opacity:.35}}
.escena.toc{animation:toc .42s ease}
@keyframes toc{20%{transform:translateX(-2px) rotate(-.4deg)}45%{transform:translateX(2px) rotate(.3deg)}70%{transform:translateX(-1px)}}
.fundido-luz{position:fixed;inset:0;background:radial-gradient(circle at 50% 55%,#fff3d6,#f1cf86 55%,#d6a24b);opacity:0;pointer-events:none;transition:opacity 1.2s ease;z-index:10}
.fundido-luz.on{opacity:1}

/* ============ PANTALLA 2 · CALENDARIO ============ */
#calendario-pantalla{
  position:relative;min-height:100%;
  background:radial-gradient(ellipse at 50% -10%,#3a0d16 0%,#200810 45%,var(--noche) 100%) no-repeat top/100% 900px,var(--noche);
  padding:max(48px,env(safe-area-inset-top)) 16px 80px;
}
#calendario-pantalla.oculta{position:fixed}
.cabecera{max-width:640px;margin:0 auto 40px;text-align:center}
.para{font-family:var(--ui);font-weight:700;font-size:11px;letter-spacing:.42em;color:var(--oro)}
.nombre{font-family:var(--sans);font-size:clamp(54px,16vw,120px);line-height:.95;letter-spacing:-.03em;color:var(--crema);margin:8px 0 22px}
.dedicatoria{font-family:var(--serif);font-size:clamp(17px,2.4vw,20px);line-height:1.55;color:rgba(245,238,226,.82);max-width:30em;margin:0 auto}
.firma{font-family:var(--firma);font-style:italic;color:var(--oro);font-size:clamp(18px,2.6vw,22px);margin-top:14px}

.mosaico{max-width:880px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(78px,22vw);gap:10px;grid-auto-flow:dense}
@media(min-width:720px){.mosaico{grid-template-columns:repeat(6,1fr);grid-auto-rows:120px;gap:14px}}

.casilla{position:relative;perspective:1000px;border-radius:12px;opacity:0;transform:translateY(14px);animation:aparece .8s ease forwards}
@keyframes aparece{to{opacity:1;transform:none}}
.casilla.ancha{grid-column:span 2}
.casilla.alta{grid-row:span 2}
.casilla.grande{grid-column:span 2;grid-row:span 2}
.tarjeta{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.5,.05,.2,1)}
.casilla.abierta .tarjeta{transform:rotateY(180deg)}
.cara{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;
  display:flex;align-items:flex-start;justify-content:flex-start;padding:10px 12px;box-shadow:0 10px 24px -12px rgba(0,0,0,.7)}
.cara.frente{transition:transform .25s ease,filter .25s}
.casilla:hover .cara.frente{filter:brightness(1.06)}
.casilla:active .cara.frente{transform:scale(.97)}
.num{font-family:var(--sans);font-size:clamp(30px,9vw,54px);line-height:.9;letter-spacing:-.03em}
.ancha .num,.alta .num{font-size:clamp(36px,11vw,64px)}
.c-rojo .frente{background:linear-gradient(150deg,#d82a35,var(--rojo) 55%,#ae1823);color:var(--crema)}
.c-crema .frente{background:linear-gradient(150deg,#fbf6ec,var(--crema) 55%,var(--crema2));color:var(--rojo-osc)}
.c-burdeos .frente{background:linear-gradient(150deg,#6d1a28,var(--burdeos) 60%,#43101a);color:var(--crema);box-shadow:inset 0 0 0 1px rgba(212,173,94,.18),0 10px 24px -12px rgba(0,0,0,.7)}
.cara.dorso{transform:rotateY(180deg);flex-direction:column;justify-content:space-between;
  background:linear-gradient(150deg,#2b0c12,#1c070b);color:var(--oro);box-shadow:inset 0 0 0 1px rgba(212,173,94,.45)}
.dorso .num{-webkit-text-stroke:1px var(--oro);color:transparent;font-size:clamp(26px,7vw,44px)}
.dorso small{font-family:var(--ui);font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:rgba(212,173,94,.8)}
.cerrada-futuro .frente::after{content:"";position:absolute;right:10px;bottom:10px;width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.35}

/* Día 24 */
.c-oro .frente{background:
    linear-gradient(115deg,transparent 30%,rgba(255,255,255,.22) 45%,transparent 60%) 0 0/250% 100%,
    linear-gradient(150deg,#f0d28c,#d4ad5e 40%,#b48a3e 75%,#9a7230);
  color:#fffaf0;animation:brillo 6s ease-in-out infinite}
@keyframes brillo{0%,100%{background-position:120% 0,0 0}50%{background-position:-20% 0,0 0}}
.cinta-v,.cinta-h{position:absolute;background:linear-gradient(90deg,#f3ede2,#fff 50%,#ece4d5);box-shadow:0 0 6px rgba(0,0,0,.12)}
.cinta-v{top:0;bottom:0;left:58%;width:11%}
.cinta-h{left:0;right:0;top:42%;height:11%;background:linear-gradient(180deg,#f3ede2,#fff 50%,#ece4d5)}
.lazo{position:absolute;left:63.5%;top:47.5%;width:0;height:0;z-index:2}
.lazo i{position:absolute;width:54px;height:30px;border:9px solid #fdfaf3;border-radius:50%;top:-15px;box-shadow:0 3px 6px rgba(0,0,0,.18)}
.lazo i:nth-child(1){right:2px;transform:rotate(-24deg)}
.lazo i:nth-child(2){left:2px;transform:rotate(24deg)}
.lazo b{position:absolute;width:16px;height:16px;border-radius:5px;background:#fff;left:-8px;top:-8px;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.c-oro .num{position:absolute;left:12px;bottom:6px;font-size:clamp(70px,22vw,130px);z-index:1;text-shadow:0 2px 10px rgba(120,80,20,.35)}
.etiqueta{position:absolute;left:12px;top:12px;z-index:3;font-family:var(--ui);font-weight:700;font-size:9px;letter-spacing:.22em;
  background:var(--crema);color:var(--oro-osc);padding:5px 9px 5px 14px;border-radius:3px;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.etiqueta::before{content:"";position:absolute;left:5px;top:50%;width:4px;height:4px;border-radius:50%;background:var(--oro);transform:translateY(-50%)}

/* Aviso */
.aviso{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;z-index:40;
  background:rgba(24,6,10,.92);color:var(--crema);border:1px solid rgba(212,173,94,.45);border-radius:999px;
  padding:12px 20px;font-family:var(--ui);font-size:13px;font-weight:500;white-space:nowrap;max-width:calc(100vw - 32px);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 12px 30px rgba(0,0,0,.5);transition:all .45s cubic-bezier(.3,.7,.2,1);pointer-events:none}
.aviso.ver{opacity:1;transform:translate(-50%,0)}
.modo-prueba{position:fixed;top:10px;right:10px;z-index:30;font-family:var(--ui);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--oro);border:1px solid rgba(212,173,94,.5);border-radius:999px;padding:5px 10px;background:rgba(0,0,0,.4)}

/* Ventana del mensaje */
.velo{position:fixed;inset:0;z-index:50;background:rgba(10,2,4,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:20px 16px;opacity:0;pointer-events:none;transition:opacity .45s ease}
.velo.ver{opacity:1;pointer-events:auto}
.ventana{position:relative;width:100%;max-width:440px;max-height:calc(100dvh - 40px);overflow:auto;
  background:linear-gradient(170deg,#fbf6ec,var(--crema) 60%,var(--crema2));color:var(--tinta);border-radius:16px;
  padding:34px 28px 28px;text-align:center;box-shadow:0 40px 80px -20px rgba(0,0,0,.8),inset 0 0 0 1px rgba(163,123,51,.35),inset 0 0 0 7px var(--crema),inset 0 0 0 8px rgba(163,123,51,.25);
  transform:translateY(24px) scale(.96);transition:transform .55s cubic-bezier(.3,.8,.2,1)}
.velo.ver .ventana{transform:none}
.ventana .dia{font-family:var(--ui);font-weight:700;font-size:10px;letter-spacing:.4em;color:var(--oro-osc)}
.ventana .num-grande{font-family:var(--sans);font-size:76px;line-height:1;color:var(--rojo);margin:6px 0 14px;letter-spacing:-.03em}
.ventana .texto{font-family:var(--serif);font-size:20px;line-height:1.55;white-space:pre-line}
.ventana img{display:block;width:100%;border-radius:10px;margin:20px 0 4px;box-shadow:0 10px 24px -12px rgba(0,0,0,.5)}
.ventana .enlace{display:inline-block;margin-top:20px;font-family:var(--ui);font-weight:600;font-size:13px;letter-spacing:.06em;
  color:var(--crema);background:var(--rojo);padding:12px 22px;border-radius:999px;text-decoration:none;transition:background .2s}
.ventana .enlace:hover{background:var(--rojo-osc)}
.ventana .firma{margin-top:20px;font-size:19px;color:var(--oro-osc)}
.cerrar{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--oro-osc)}
.cerrar:hover{background:rgba(163,123,51,.12)}
.cerrar svg{width:16px;height:16px}
.pie{text-align:center;margin-top:48px;font-family:var(--ui);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:rgba(212,173,94,.5)}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.2s!important}}
</style>
</head>
<body>

<!-- PANTALLA 1 -->
<section id="puerta-pantalla" class="pantalla">
  <p class="antetitulo">Diciembre ha llegado</p>
  <h1 class="titulo-puerta"><span class="mi-nombre"></span> te espera dentro</h1>
  <div class="escena" id="escena" role="button" tabindex="0" aria-label="Llamar a la puerta">
    <div class="marco"></div>
    <div class="hueco">
      <div class="hojas">
        <div class="hoja izq"></div>
        <div class="hoja der"></div>
      </div>
    </div>
    <div class="corona"></div>
    <div class="bayas" id="bayas"></div>
    <div class="placa">Mi ratón</div>
    <div class="luz" id="luz"></div>
  </div>
  <p class="llama">Llama para entrar</p>
</section>
<div class="fundido-luz" id="fundido"></div>

<!-- PANTALLA 2 -->
<main id="calendario-pantalla" class="pantalla oculta" aria-hidden="true">
  <header class="cabecera">
    <p class="para">PARA</p>
    <h2 class="nombre">Mi ratón</h2>
    <p class="dedicatoria">Este diciembre, cada mañana tienes una sorpresa. 24 días en los que te recuerdo lo mucho que te quiero.</p>
    <p class="firma">Con cariño, <span class="mi-nombre"></span></p>
  </header>
  <div class="mosaico" id="mosaico"></div>
  <p class="pie">Diciembre · <span id="pie-anio"></span></p>
</main>

<div class="aviso" id="aviso" role="status" aria-live="polite"></div>

<div class="velo" id="velo" aria-hidden="true">
  <div class="ventana" role="dialog" aria-modal="true" aria-labelledby="v-dia">
    <button class="cerrar" id="cerrar" aria-label="Cerrar">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 3l10 10M13 3L3 13"/></svg>
    </button>
    <p class="dia" id="v-dia">DÍA</p>
    <p class="num-grande" id="v-num"></p>
    <p class="texto" id="v-texto"></p>
    <img id="v-foto" alt="" hidden>
    <a class="enlace" id="v-enlace" target="_blank" rel="noopener" hidden></a>
    <p class="firma">— <span class="mi-nombre"></span></p>
  </div>
</div>

<script>
/* =====================================================================
   EDITA AQUÍ
   ===================================================================== */
const MI_NOMBRE = "Hugo";     // ← tu nombre (sale en la puerta y en la firma)
const ANIO = 2026;            // ← año del calendario

/* Un mensaje por día (posición 0 = día 1 ... posición 23 = día 24).
   Campos:
     texto  → obligatorio
     foto   → opcional: ruta o URL de una imagen, p. ej. "fotos/dia1.jpg"
     enlace → opcional: URL (canción, vídeo, reserva...)
     textoEnlace → opcional: texto del botón del enlace                       */
const MENSAJES = [
  { texto: "Empieza diciembre y empiezo yo a recordarte, cada día, lo afortunado que soy de tenerte." },
  { texto: "Hoy quiero que sepas que tu risa es mi sonido favorito del mundo." },
  { texto: "Esta canción me hace pensar en ti. Escúchala con los ojos cerrados.", enlace: "https://open.spotify.com/", textoEnlace: "Escuchar nuestra canción" },
  { texto: "Vale por un desayuno en la cama, el día que tú elijas." },
  { texto: "¿Te acuerdas de nuestra primera cita? Yo me acuerdo de cada detalle." },
  { texto: "Hoy me toca darte las gracias: por tu paciencia, por tu calma y por quedarte." },
  { texto: "Vale por una tarde entera de manta, peli y sin móviles." },
  { texto: "Lo que más me gusta de ti es imposible de elegir, así que te lo digo todo junto: tú." },
  { texto: "Hoy toca plan sorpresa. Ponte guapa (aunque ya lo estás). A las 20:00." },
  { texto: "Cada vez que algo bueno me pasa, eres la primera persona a la que quiero contárselo." },
  { texto: "Vale por un masaje de veinte minutos, sin prisas y sin quejas." },
  { texto: "Esta foto es de uno de mis días favoritos contigo.", foto: "" },
  { texto: "Contigo hasta lo más normal se vuelve bonito: un supermercado, un atasco, un lunes." },
  { texto: "Vale por elegir tú la cena esta noche. Sin vetos." },
  { texto: "Me encanta cómo arrugas la nariz cuando algo te hace gracia." },
  { texto: "Hoy te propongo un paseo para ver las luces de Navidad, de la mano." },
  { texto: "Gracias por hacer de cualquier sitio un hogar." },
  { texto: "Vale por un 'tienes razón' que puedes usar en cualquier discusión." },
  { texto: "Si pudiera volver atrás, te encontraría antes." },
  { texto: "Hoy cocino yo tu plato favorito. Tú solo tienes que poner la mesa (y la sonrisa)." },
  { texto: "Eres mi lugar seguro, mi ratón." },
  { texto: "Quedan muy poquitos días. Ya casi está aquí lo mejor." },
  { texto: "Mañana es el gran día. Esta noche, duerme pronto y sueña bonito." },
  { texto: "Feliz Nochebuena, mi ratón.\n\nEl mejor regalo de este año, y de todos, has sido tú. Te quiero muchísimo." },
];

/* =====================================================================
   A partir de aquí no hace falta tocar nada
   ===================================================================== */
const ORDEN = [7,15,24,1,22,4,20,13,9,18,3,11,16,6,2,19,10,23,5,14,8,21,12,17];
const TAMANOS = {24:"grande",1:"ancha",9:"ancha",13:"ancha",22:"ancha",6:"ancha",15:"alta",18:"alta",4:"alta",11:"alta"};
const COLORES = ["c-rojo","c-crema","c-burdeos"];
const CLAVE = "adviento-mi-raton-" + ANIO;
let MODO_PRUEBA = new URLSearchParams(location.search).get("test") === "1" || location.hash === "#prueba";

document.querySelectorAll(".mi-nombre").forEach(e => e.textContent = MI_NOMBRE);
document.getElementById("pie-anio").textContent = ANIO;

/* ---------- Fecha en España ---------- */
function hoyEnEspana(){
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Madrid",year:"numeric",month:"2-digit",day:"2-digit"})
    .formatToParts(new Date()).map(x => [x.type,x.value]));
  return `${p.year}-${p.month}-${p.day}`;
}
function desbloqueado(d){
  if (MODO_PRUEBA) return true;
  return hoyEnEspana() >= `${ANIO}-12-${String(d).padStart(2,"0")}`;
}

/* ---------- Guardado ---------- */
function leerAbiertas(){ try { return new Set(JSON.parse(localStorage.getItem(CLAVE)) || []); } catch(e){ return new Set(); } }
function guardarAbierta(d){ const s = leerAbiertas(); s.add(d); try { localStorage.setItem(CLAVE, JSON.stringify([...s])); } catch(e){} }

/* ---------- Sonido toc toc (sintetizado) ---------- */
let audio;
function golpe(t){
  const ctx = audio;
  const osc = ctx.createOscillator(), g = ctx.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(190, t);
  osc.frequency.exponentialRampToValueAtTime(70, t + .12);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.9, t + .004);
  g.gain.exponentialRampToValueAtTime(0.0001, t + .18);
  osc.connect(g).connect(ctx.destination); osc.start(t); osc.stop(t + .2);
  const len = ctx.sampleRate * .05, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 4);
  const n = ctx.createBufferSource(), f = ctx.createBiquadFilter(), gn = ctx.createGain();
  n.buffer = buf; f.type = "bandpass"; f.frequency.value = 900; f.Q.value = .8; gn.gain.value = .55;
  n.connect(f).connect(gn).connect(ctx.destination); n.start(t);
}
function tocToc(){
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
    const t = audio.currentTime + .02; golpe(t); golpe(t + .2);
  } catch(e){}
  if (navigator.vibrate) navigator.vibrate([25, 170, 25]);
}

/* ---------- Pantalla 1 ---------- */
const escena = document.getElementById("escena");
const bayas = document.getElementById("bayas");
for (let i = 0; i < 9; i++){
  const a = (i / 9) * Math.PI * 2 + .3, r = 30;
  const b = document.createElement("i");
  b.style.left = (50 + r*Math.cos(a) - 3) + "%"; b.style.top = (50 + r*Math.sin(a) - 3) + "%";
  bayas.appendChild(b);
}
let entrando = false;
function entrar(){
  if (entrando) return; entrando = true;
  tocToc();
  escena.classList.add("toc");
  setTimeout(() => escena.classList.add("abierta"), 520);
  setTimeout(() => { const l = document.getElementById("luz"); l.style.transform = "translate(-50%,-50%) scale(60)"; }, 1300);
  setTimeout(() => document.getElementById("fundido").classList.add("on"), 2100);
  setTimeout(() => {
    document.getElementById("puerta-pantalla").classList.add("oculta");
    const cal = document.getElementById("calendario-pantalla");
    cal.classList.remove("oculta"); cal.setAttribute("aria-hidden","false");
    document.body.classList.add("en-calendario");
    window.scrollTo(0,0); construirMosaico();
    document.getElementById("fundido").classList.remove("on");
  }, 3400);
}
escena.addEventListener("click", entrar);
escena.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); entrar(); } });

/* ---------- Pantalla 2 ---------- */
let construido = false;
function construirMosaico(){
  if (construido) return; construido = true;
  const m = document.getElementById("mosaico"), abiertas = leerAbiertas();
  ORDEN.forEach((d, i) => {
    const c = document.createElement("button");
    const color = d === 24 ? "c-oro" : COLORES[i % 3];
    c.className = `casilla ${TAMANOS[d] || ""} ${color}`;
    c.style.animationDelay = (i * 45) + "ms";
    c.setAttribute("aria-label", `Día ${d}`);
    if (abiertas.has(d) && desbloqueado(d)) c.classList.add("abierta");
    if (!desbloqueado(d)) c.classList.add("cerrada-futuro");
    const frente = d === 24
      ? `<div class="cara frente"><span class="etiqueta">EL GRAN DÍA</span><span class="cinta-v"></span><span class="cinta-h"></span><span class="lazo"><i></i><i></i><b></b></span><span class="num">24</span></div>`
      : `<div class="cara frente"><span class="num">${d}</span></div>`;
    c.innerHTML = `<div class="tarjeta">${frente}<div class="cara dorso"><span class="num">${d}</span><small>Abierta</small></div></div>`;
    c.addEventListener("click", () => tocarCasilla(d, c));
    m.appendChild(c);
  });
}

let temporizadorAviso;
function aviso(txt){
  const a = document.getElementById("aviso");
  a.textContent = txt; a.classList.add("ver");
  clearTimeout(temporizadorAviso);
  temporizadorAviso = setTimeout(() => a.classList.remove("ver"), 2600);
}

function tocarCasilla(d, el){
  if (!desbloqueado(d)){
    aviso(`Esta puerta se abre el ${d} de diciembre`);
    if (navigator.vibrate) navigator.vibrate(12);
    return;
  }
  if (el.classList.contains("abierta")){ mostrarMensaje(d); return; }
  el.classList.add("abierta"); guardarAbierta(d);
  if (navigator.vibrate) navigator.vibrate(15);
  setTimeout(() => mostrarMensaje(d), 750);
}

const velo = document.getElementById("velo");
let ultimoFoco;
function mostrarMensaje(d){
  const msg = MENSAJES[d-1] || { texto: "" };
  document.getElementById("v-dia").textContent = `${d} DE DICIEMBRE`;
  document.getElementById("v-num").textContent = d;
  document.getElementById("v-texto").textContent = msg.texto || "";
  const f = document.getElementById("v-foto");
  if (msg.foto){ f.src = msg.foto; f.hidden = false; } else { f.hidden = true; f.removeAttribute("src"); }
  const a = document.getElementById("v-enlace");
  if (msg.enlace){ a.href = msg.enlace; a.textContent = msg.textoEnlace || "Abrir"; a.hidden = false; } else a.hidden = true;
  ultimoFoco = document.activeElement;
  velo.classList.add("ver"); velo.setAttribute("aria-hidden","false");
  velo.querySelector(".ventana").scrollTop = 0;
  document.getElementById("cerrar").focus({preventScroll:true});
}
function cerrarMensaje(){
  velo.classList.remove("ver"); velo.setAttribute("aria-hidden","true");
  if (ultimoFoco) ultimoFoco.focus({preventScroll:true});
}
document.getElementById("cerrar").addEventListener("click", cerrarMensaje);
velo.addEventListener("click", e => { if (e.target === velo) cerrarMensaje(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && velo.classList.contains("ver")) cerrarMensaje(); });

function activarPrueba(){
  MODO_PRUEBA = true;
  if (!document.querySelector(".modo-prueba")){
    const b = document.createElement("div"); b.className = "modo-prueba"; b.textContent = "Modo prueba";
    document.body.appendChild(b);
  }
  document.querySelectorAll(".casilla").forEach(c => c.classList.remove("cerrada-futuro"));
}
if (MODO_PRUEBA) activarPrueba();
/* Truco secreto: toca 5 veces la palabra "PARA" para desbloquearlo todo */
let toquesPara = 0, tPara;
document.querySelector(".para").addEventListener("click", () => {
  toquesPara++; clearTimeout(tPara); tPara = setTimeout(() => toquesPara = 0, 1500);
  if (toquesPara >= 5 && !MODO_PRUEBA){ activarPrueba(); aviso("Modo prueba: todas las puertas abiertas"); }
});
</script>
